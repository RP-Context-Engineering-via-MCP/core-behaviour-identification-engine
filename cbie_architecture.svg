<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="100%" height="100%">
    <defs>
        <!-- Arrowhead Marker -->
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#6366f1" />
        </marker>
        
        <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#f43f5e" />
        </marker>
        
        <!-- Background Gradient -->
        <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#020617"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        
        <!-- Node Gradient -->
        <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        
        <!-- Engine Boundary Gradient -->
        <linearGradient id="engineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#020617" stop-opacity="0.7"/>
        </linearGradient>
        
        <!-- Subtle shadow for nodes -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Main Background -->
    <rect width="1600" height="620" fill="url(#gradBg)"/>

    <!-- CBIE Engine Boundary Box -->
    <rect x="190" y="60" width="1020" height="520" rx="16" fill="url(#engineGrad)" stroke="#334155" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="700" y="100" fill="#94a3b8" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="3">CBIE OFFLINE ANALYTICAL ENGINE</text>

    <!-- Edges / Connections -->
    <g stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow)">
        <!-- DB to Adapter -->
        <path d="M170,300 L210,300"/>
        
        <!-- Adapter to NLP -->
        <path d="M350,300 L390,300"/>
        
        <!-- NLP to Clustering -->
        <path d="M560,300 L600,300"/>
        
        <!-- Clustering to Temporal (Top) -->
        <path d="M770,300 C790,300 790,205 810,205"/>
        
        <!-- Clustering to Trend (Bottom) -->
        <path d="M770,300 C790,300 790,395 810,395"/>
        
        <!-- Temporal to Confirmation -->
        <path d="M990,205 C1010,205 1010,300 1030,300"/>
        
        <!-- Trend to Confirmation -->
        <path d="M990,395 C1010,395 1010,300 1030,300"/>

        <!-- Confirmation to Profile DB -->
        <path d="M1190,300 L1230,300"/>
        
        <!-- Profile DB to LLM -->
        <path d="M1380,300 L1420,300"/>
    </g>

    <!-- Noise Rejection Edge -->
    <g stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow-red)">
        <path d="M685,355 L685,480"/>
    </g>

    <!-- NODES -->

    <!-- 1. Behaviours DB -->
    <rect x="30" y="260" width="140" height="80" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="295" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Behaviours DB</text>
    <text x="100" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">(Real-time BAC logs)</text>

    <!-- 2. Data Adapter -->
    <rect x="210" y="260" width="140" height="80" rx="12" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    <text x="280" y="295" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Data Adapter</text>
    <text x="280" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Batch Ingestion</text>

    <!-- 3. Stage 1: NLP Embedding -->
    <rect x="390" y="245" width="170" height="110" rx="12" fill="url(#boxGrad)" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <text x="475" y="275" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Stage 1: Embedding</text>
    <text x="475" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="middle">Sentence-Transformers</text>
    <text x="475" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Generates 384d Vectors</text>
    <text x="475" y="335" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">(Captures Semantics)</text>

    <!-- 4. Stage 2: Clustering -->
    <rect x="600" y="245" width="170" height="110" rx="12" fill="url(#boxGrad)" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
    <text x="685" y="275" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Stage 2: Clustering</text>
    <text x="685" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="middle">DBSCAN Algorithm</text>
    <text x="685" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Applies Reinforcement</text>
    <text x="685" y="335" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">(Isolates Core Topics)</text>

    <!-- Noise Rejection Node -->
    <rect x="610" y="480" width="150" height="60" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="685" y="505" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Discarded</text>
    <text x="685" y="525" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">(Sparse Noise)</text>

    <!-- 5. Stage 3A: Temporal -->
    <rect x="810" y="160" width="180" height="90" rx="12" fill="url(#boxGrad)" stroke="#d946ef" stroke-width="2" filter="url(#shadow)"/>
    <text x="900" y="190" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Stage 3A: Temporal</text>
    <text x="900" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="middle">Gini Coefficient</text>
    <text x="900" y="230" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">(Measures Consistency)</text>

    <!-- 6. Stage 3B: Trend -->
    <rect x="810" y="350" width="180" height="90" rx="12" fill="url(#boxGrad)" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
    <text x="900" y="380" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Stage 3B: Trend</text>
    <text x="900" y="400" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="middle">Mann-Kendall Test</text>
    <text x="900" y="420" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">(Detects Momentum)</text>

    <!-- 7. Stage 4: Confirmation -->
    <rect x="1030" y="245" width="160" height="110" rx="12" fill="url(#boxGrad)" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
    <text x="1110" y="275" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Stage 4: Decision</text>
    <text x="1110" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="middle">AHP Weighted Model</text>
    <text x="1110" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Combines all signals</text>
    <text x="1110" y="335" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">(&gt;= 0.70 = Stable)</text>

    <!-- 8. Core Profile DB -->
    <rect x="1230" y="260" width="150" height="80" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="1305" y="295" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Profile Storage</text>
    <text x="1305" y="315" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">(Structured JSON)</text>

    <!-- 9. LLM Generation -->
    <rect x="1420" y="260" width="140" height="80" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
    <text x="1490" y="295" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Memora LLM</text>
    <text x="1490" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">(Context Injected)</text>

</svg>
